plugins {
    id 'fabric-loom' version '1.14.10'
    id 'java-library'
}

version = mod_version
group = 'com.pureneko.gesturekeys'
base.archivesName = 'gesturekeys-fabric-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

repositories {
    maven { url = 'https://maven2.fabricmc.net/'; content { includeGroupByRegex 'net.fabricmc.*' } }
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}

// Use Fabric's official alternate Maven endpoint for all Loom-added repositories.
repositories.configureEach { repo ->
    if (repo instanceof MavenArtifactRepository && repo.url.host == 'maven.fabricmc.net') {
        repo.setUrl('https://maven2.fabricmc.net/')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modCompileOnly "maven.modrinth:modmenu:${modmenu_version}"
    modLocalRuntime "maven.modrinth:modmenu:${modmenu_version}"
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    runs {
        client {
            client()
            runDir 'run-fabric'
            if (project.hasProperty('launchCheck')) {
                runDir 'run-fabric-check'
                vmArg '-Dgesturekeys.launchCheck=true'
            }
        }
    }
}

if (project.hasProperty('launchCheck')) sourceSets.main.java.srcDir('src/launchCheck/java')

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources', ProcessResources) {
    inputs.properties(version: project.version, loader_version: loader_version,
            minecraft_version: minecraft_version, fabric_version: fabric_version)
    filesMatching('fabric.mod.json') {
        expand(version: project.version, loader_version: loader_version,
                minecraft_version: minecraft_version, fabric_version: fabric_version)
    }
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(Jar).configureEach { from('LICENSE') }
tasks.named('jar', Jar) {
    manifest.attributes('Implementation-Title': 'GestureKeys Fabric', 'Implementation-Version': project.version)
}
